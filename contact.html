
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의 - Lotto Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-toggle">
            <button id="toggle-theme">🌓 테마 변경</button>
        </div>
        <nav style="margin-bottom: 20px;">
            <a href="index.html" style="color: var(--text-color); text-decoration: none; font-size: 0.9rem;">← 로또 번호 생성기로 돌아가기</a>
        </nav>
        
        <h1>제휴 문의</h1>
        <p style="margin-bottom: 2rem; color: var(--text-color); opacity: 0.8;">비즈니스 제휴 및 협업 문의를 남겨주세요.</p>

        <form action="https://formspree.io/f/xlgwlrql" method="POST" id="contact-form">
            <div class="form-group">
                <input type="text" name="name" placeholder="담당자 성함" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" placeholder="이메일 주소" required>
            </div>
            <div class="form-group">
                <input type="text" name="company" placeholder="회사명/단체명">
            </div>
            <div class="form-group">
                <textarea name="message" rows="5" placeholder="문의 내용 상세" required></textarea>
            </div>
            
            <button type="submit" id="generate">문의 보내기</button>
            <div id="status"></div>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
