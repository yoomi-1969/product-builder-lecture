<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 | 사주아이</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .success { color: #2ecc71; margin-top: 1rem; font-weight: 600; }
        .error { color: #e74c3c; margin-top: 1rem; font-weight: 600; }
    </style>
</head>
<body data-theme="light">
    <header>
        <a href="index.html" class="logo">🍀 사주아이</a>
        <nav>
            <ul>
                <li><a href="index.html">홈</a></li>
                <li><a href="index.html#blog">육아 정보</a></li>
                <li><a href="contact.html">문의</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>제휴 및 문의</h1>
            <p style="margin-top: 1rem; margin-bottom: 2rem;">사주아이 서비스와 관련된 제휴 제안이나 문의사항이 있으시면 아래 양식을 통해 보내주세요.</p>
            
            <form action="https://formspree.io/f/mqakayvo" method="POST" id="contact-form" class="saju-form">
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea id="message" name="message" rows="5" style="padding: 1rem; border-radius: 0.8rem; border: 2px solid oklch(0.9 0.01 200); background: var(--bg-main); color: var(--text-main); font-family: inherit;" required></textarea>
                </div>
                <button type="submit" class="btn-primary">보내기</button>
                <div id="status"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 사주아이. All rights reserved.</p>
        <div class="footer-links">
            <a href="privacy.html">개인정보처리방침</a>
            <a href="terms.html">이용약관</a>
            <a href="contact.html">제휴문의</a>
        </div>
    </footer>

    <script src="main.js"></script>
    <script>
        const contactForm = document.getElementById("contact-form");
        if (contactForm) {
            contactForm.addEventListener("submit", async function(event) {
                event.preventDefault();
                const status = document.getElementById("status");
                const data = new FormData(event.target);
                
                try {
                    const response = await fetch(event.target.action, {
                        method: contactForm.method,
                        body: data,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (response.ok) {
                        status.innerHTML = "문의가 성공적으로 전달되었습니다!";
                        status.className = "success";
                        contactForm.reset();
                    } else {
                        status.innerHTML = "문제가 발생했습니다. 다시 시도해 주세요.";
                        status.className = "error";
                    }
                } catch (error) {
                    status.innerHTML = "서버와 통신 중 오류가 발생했습니다.";
                    status.className = "error";
                }
            });
        }
    </script>
</body>
</html>
